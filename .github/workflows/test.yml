name: unit tests
on: [push]

jobs:
  unit-tests:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        node: [ 22, 23, 24 ]
    steps:
      - uses: actions/checkout@v3
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: setup deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.2.3
      - name: build
        run: deno task build
      - name: test
        run: deno task test
#      - name: E2E(node)
#        run: deno task test:node
      - name: E2E(deno)
        run: deno task test:deno

